name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  release-windows:
    name: Release Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps --projectDir apps/desktop

      - name: Build app bundles
        run: npm run build --workspace=@m3u-mixer/desktop

      - name: Build Windows release
        run: npx electron-builder --config electron-builder.yml --projectDir apps/desktop

      - name: Collect Windows release files
        shell: bash
        run: |
          mkdir -p release-files/windows
          find apps/desktop/release -type f \
            \( -name "*.exe" -o -name "*.yml" -o -name "*.yaml" -o -name "*.blockmap" \) \
            -exec cp {} release-files/windows/ \;

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-files/windows/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
