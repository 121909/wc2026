appId: com.m3umixer.desktop
productName: M3U Mixer
electronVersion: 36.4.0
directories:
  output: release/${version}
files:
  - out/**
  - package.json
extraMetadata:
  main: out/main/index.js
asar: true
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  darkModeSupport: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch:
        - x64
