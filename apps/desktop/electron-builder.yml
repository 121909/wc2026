appId: com.m3umixer.desktop
productName: M3U Mixer
electronVersion: 36.4.0
directories:
  output: release/${version}
files:
  - out/**
  - package.json
extraMetadata:
  main: out/main/index.js
asar: true
npmRebuild: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
